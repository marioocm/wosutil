[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wosutil"
version = "1.5.0"
description = "Python automation tool for Whiteout Survival using Android emulators (MuMu, BlueStacks, LDPlayer on Windows; Waydroid on Linux)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "typing-extensions>=4.0.0",
    "psutil>=5.9.0",
    "pyperclip>=1.8.0",
    "pywebview>=6.2.1,<7.0",
    "rapidocr>=3.10.0,<4.0.0",
    "onnxruntime>=1.31.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pyinstaller>=6.15.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
wosutil = "wosutil.ui.main:run"
wosutil-web = "wosutil.ui.main:run"
wosutil-paste = "wosutil.emulator.clipboard:main"
template-creator = "wosutil.ui.main:run_template"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 200
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["UP006", "UP035", "UP045"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disable_error_code = "assignment"

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "rapidocr.*"
ignore_errors = true

[tool.ruff.format]
quote-style = "double"
