name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Format check with ruff
        run: ruff format --check .
      - name: Typecheck with mypy
        run: mypy src/wosutil/
      - name: Run tests with pytest
        run: pytest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with pytest
        run: pytest
      - name: Build the Windows executable
        run: .\scripts\build.ps1
      - name: Upload the Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WosUtil-windows
          path: dist/WosUtil.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK/WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0
      - name: Install package in a system-site-packages venv
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Build the Linux binary
        run: ./scripts/build.sh
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: WosUtil-linux
          path: dist/WosUtil
          if-no-files-found: error

