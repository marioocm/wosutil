name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate version matches tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $pyVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($tagVersion -ne $pyVersion) {
            throw "Tag ${{ github.ref_name }} does not match pyproject version $pyVersion"
          }

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .
      - name: Format check with ruff
        run: ruff format --check .
      - name: Typecheck with mypy
        run: mypy src/wosutil/
      - name: Run tests with pytest
        run: pytest

      - name: Build exe
        run: .\scripts\build.ps1

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/WosUtil.exe

  linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK/WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0

      - name: Install package in a system-site-packages venv
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Build the Linux binary
        run: ./scripts/build.sh

      - name: Package the Linux binary
        run: tar -czf dist/WosUtil-linux-x86_64.tar.gz -C dist WosUtil

      - name: Attach the Linux binary to the release
        run: gh release upload "${{ github.ref_name }}" dist/WosUtil dist/WosUtil-linux-x86_64.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
